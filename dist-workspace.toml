[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist): release builds for the four targets
# (ARCHITECTURE §9), a shell installer and a Homebrew formula.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "homebrew"]
tap = "infktd/homebrew-tap"
formula = "spektr"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# A PR builds every target's artifacts (the dry-run release) and uploads
# them to the run; publishing happens only on a vX.Y.Z tag.
pr-run-mode = "upload"
install-path = "CARGO_HOME"
install-updater = false

# Native runners, as CI (ARCHITECTURE §9): no cross toolchains.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"
x86_64-apple-darwin = "macos-26-intel"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
