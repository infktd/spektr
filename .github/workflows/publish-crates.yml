# Publish every library crate and the binary to crates.io on a release tag
# (ARCHITECTURE §9: `cargo install spektr` needs them all). Needs the
# CARGO_REGISTRY_TOKEN secret. PRs and pushes only package and verify.
name: crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish-crates.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: publish
      - name: Package and verify (dry run)
        if: github.event_name == 'pull_request'
        run: cargo publish --dry-run --workspace --locked
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
