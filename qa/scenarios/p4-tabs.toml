name = "Graph tabs: timeline and path"
size = [170, 48]
compare = "docs/design/Identity.dc.html"
checklist = [
  "Tab labels in the graph border: the active one `[2 timeline]` in accent",
  "Timeline: `N of M events   e kind: all`; rows `▲? YYYY-MM-DD HH:MM  glyph entity  attr  module`",
  "A full-width warn divider `── last seen 2026-09-28 ──`; rows after it carry ▲ (warn)",
  "`e` filters by kind (the header names it); the inspector follows the timeline cursor",
  "Path picker dialog: `Path to…` with a find field and entity picks",
  "Path view: `path <from> → <to>`; entities stacked with `│ → predicate ▰▰▱` between them",
]

[[step]]
run = ["new", "demo", "--profile", "tracelabs", "--subject", "Jordan Marlow", "--last-seen", "2026-09-28"]

[[step]]
run = ["run", "demo.spektr", "--seed", "username:jmarlow.wav"]

[[step]]
run = ["open", "demo.spektr"]
do = [
  "wait has_account",
  "keys 2",
  "wait last seen 2026-09-28 ─",
  "settle 300",
  "frame timeline",
  "keys G",
  "frame timeline-bottom",
  "keys e",
  "frame timeline-kind",
  "keys 3",
  "wait Path to",
  "frame path-picker",
  "keys text:hello@ ↵",
  "wait path ~",
  "settle 300",
  "frame path",
  "keys q",
]
