[module]
name        = "fake"
version     = "0.1.0"
description = "Fictional Lemmy lookup for the exec protocol tests"
runtime     = "exec"
command     = ["python3", "../../fake.py", "fake"]
serve       = false
concurrency = 2
timeout     = "20s"
technique   = "passive"
auto        = true
consumes    = ["username"]
produces    = [["has_account", "account"], ["x.fake.member_of_instance", "x.fake.instance"]]
optional_secrets = ["FAKE_TOKEN"]
hosts       = ["lemmy.example"]

[[module.platforms]]
id = "lemmy"
case_sensitive = false
profile_url = "https://{instance}/@{user}"

[[module.types]]
name = "x.fake.instance"
normalize = "lowercase"

[[module.predicates]]
name = "x.fake.member_of_instance"
src = ["account"]
dst = ["x.fake.instance"]
